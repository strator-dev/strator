name: Release & Publish Packages

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
          registry-url: "https://registry.npmjs.org"

      - name: Build packages
        run: pnpm --filter "@strator/*" build

      - name: Check formatting and types
        run: vp check

      - name: Run tests
        run: vp test

      - name: Publish packages to NPM
        run: pnpm -r --filter "@strator/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.npm_token || secrets.NODE_AUTH_TOKEN }}

      - name: Create GitHub Release and Generate Changelog
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          title: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
