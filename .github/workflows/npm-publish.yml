name: Release & Publish Packages

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.100.1, 0.101.0, or v0.101.0 - Epoch SemVer format)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true

      - name: Setup Node & npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Resolve release version
        id: version
        env:
          # Passed through the environment, never interpolated into the script, to avoid shell injection.
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW_VERSION' is not a valid semver version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target release version: $VERSION"

      - name: Bump version in package.json
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          pnpm -r --filter "@strator/*" exec npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build packages
        run: pnpm --filter "@strator/*" build

      - name: Check formatting and types
        run: vp check

      - name: Run tests
        run: vp test

      # Before publishing, so a broken extension build stops the release before anything reaches npm.
      # The asset names carry no version, so releases/latest/download/<name> always serves the newest.
      - name: Package browser extensions
        run: |
          out="$PWD/release"
          mkdir -p "$out"
          for browser in chrome firefox; do
            dist="packages/devtools-$browser/dist"
            built=$(node -p "require('./$dist/manifest.json').version_name")
            if [ "$built" != "$VERSION" ]; then
              echo "::error::$dist/manifest.json is v$built, expected v$VERSION"
              exit 1
            fi
            (cd "$dist" && zip -qr "$out/strator-devtools-$browser.zip" .)
          done
          # The minified add-on needs its human-readable source for the AMO review: every tracked file as it
          # is now, i.e. with the version bump applied, so reviewers can rebuild the exact same package.
          git ls-files -z | xargs -0 zip -q "$out/strator-source.zip"
          ls -l "$out"

      - name: Keep the packages for the store submissions
        uses: actions/upload-artifact@v4
        with:
          name: store-packages
          path: release/
          retention-days: 30

      - name: Publish packages to NPM
        run: pnpm -r --filter "@strator/*" publish --access public --no-git-checks

      - name: Commit version bump to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet package.json packages/*/package.json; then
            git add package.json packages/*/package.json
            git commit -m "chore(release): bump version to v$VERSION"
            # The checkout may be a tag behind the default branch: replay the bump on its tip so the push
            # is a fast-forward instead of failing after the packages were already published.
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}

      - name: Create GitHub Release and Generate Changelog
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # On a manual run github.ref_name is the branch, so derive the tag from the resolved version.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          files: |
            release/strator-devtools-chrome.zip
            release/strator-devtools-firefox.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    name: Trigger website deploy
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Pushes made with GITHUB_TOKEN (like the version bump above) never start other workflows, except
      # workflow_dispatch. Dispatch the Pages deploy on the default branch so it builds the released code
      # and passes the github-pages environment's branch protection, which a tag ref would not.
      - name: Dispatch Pages deploy workflow
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}

  # Store submissions. Both may fail for now (missing credentials, first versions not created in the
  # stores yet) without failing the release: npm, the GitHub release and the website are already done.
  # Pre-releases are skipped, since the stores only accept numeric versions and a 100.2.0-beta.1 upload
  # (as 100.2.0) would block the real 100.2.0.
  publish-chrome:
    name: Submit to the Chrome Web Store
    needs: release
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: store-packages
          path: release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Setup: see the comment at the top of tools/publish-chrome-extension.mjs.
      - name: Upload and submit for review
        run: node tools/publish-chrome-extension.mjs release/strator-devtools-chrome.zip
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}

  publish-firefox:
    name: Submit to Firefox Add-ons
    needs: release
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: store-packages
          path: release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Needs an AMO API key (https://addons.mozilla.org/developers/addon/api/key/): the JWT issuer and
      # secret. The first submission creates the listing from packages/devtools-firefox/amo-metadata.json;
      # later ones add a version. web-ext submits for review and returns without waiting for approval.
      - name: Submit for review
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Missing the AMO_JWT_ISSUER / AMO_JWT_SECRET secrets"
            exit 1
          fi
          mkdir -p firefox
          unzip -q release/strator-devtools-firefox.zip -d firefox
          npx --yes web-ext@8 sign \
            --channel listed \
            --source-dir firefox \
            --upload-source-code release/strator-source.zip \
            --amo-metadata packages/devtools-firefox/amo-metadata.json \
            --approval-timeout 0 \
            --artifacts-dir web-ext-artifacts
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
