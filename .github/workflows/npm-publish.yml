name: Release & Publish Packages

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.100.1, 0.101.0, or v0.101.0 - Epoch SemVer format)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true

      - name: Setup Node & npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Resolve release version
        id: version
        run: |
          RAW_VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target release version: $VERSION"

      - name: Bump version in package.json
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          pnpm -r --filter "@strator/*" exec npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build packages
        run: pnpm --filter "@strator/*" build

      - name: Check formatting and types
        run: vp check

      - name: Run tests
        run: vp test

      - name: Publish packages to NPM
        run: pnpm -r --filter "@strator/*" publish --access public --no-git-checks

      - name: Commit version bump to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet package.json packages/*/package.json; then
            git add package.json packages/*/package.json
            git commit -m "chore(release): bump version to v$VERSION"
            git push origin HEAD:${{ github.event.repository.default_branch || 'main' }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Generate Changelog
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          title: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
