packages:
  - apps/*
  - packages/*
  - tools/*
  - examples/*

catalog:
  "@types/node": ^24
  "@types/prismjs": ^1.26.6
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  prismjs: ^1.30.0
  react: ^19.2.5
  react-dom: ^19.2.5
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  vue: ^3.5.0

catalogMode: prefer
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
